<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav"><div class="logo"><span>TECH</span> STORE / ADMIN</div><a class="primary" href="/">მაღაზია</a></div></header>
<main class="section"><div id="login"><h2>Admin შესვლა</h2><p>შედი იმ ელფოსტით, რომელიც Supabase Auth-ში Admin მომხმარებლად გაქვს შექმნილი.</p><input id="email" placeholder="ელფოსტა" style="padding:12px;width:100%;margin:7px 0"><input id="password" type="password" placeholder="პაროლი" style="padding:12px;width:100%;margin:7px 0"><button class="primary" onclick="login()">შესვლა</button><p id="msg"></p></div>
<div id="panel" class="hidden"><div class="head"><h2>შეკვეთები</h2><button class="primary" onclick="load()">განახლება</button></div><div id="orders"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb,session;
async function init(){let c=await fetch("/api/config").then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);const s=await sb.auth.getSession();if(s.data.session){session=s.data.session;show()}}
async function login(){let r=await sb.auth.signInWithPassword({email:document.querySelector("#email").value,password:document.querySelector("#password").value});if(r.error)return document.querySelector("#msg").textContent=r.error.message;session=r.data.session;show()}
function show(){document.querySelector("#login").classList.add("hidden");document.querySelector("#panel").classList.remove("hidden");load()}
async function load(){let r=await fetch("/api/admin/orders",{headers:{Authorization:"Bearer "+session.access_token}});let d=await r.json();if(!r.ok)return alert(d.error);document.querySelector("#orders").innerHTML=d.length?d.map(o=>`<div class="card" style="padding:20px;margin-bottom:14px"><b>#${o.id.slice(0,8)}</b><div class="tag">${new Date(o.created_at).toLocaleString("ka-GE")}</div><hr><b>${o.customer_name}</b><br>📧 ${o.customer_email}<br>📞 ${o.customer_phone}<br>📍 ${o.customer_address}<br>📦 ${o.product}<br>💰 ${o.total} ₾<br><br><select onchange="status('${o.id}',this.value)" style="padding:9px"><option ${o.status==="ახალი"?"selected":""}>ახალი</option><option ${o.status==="დამუშავება"?"selected":""}>დამუშავება</option><option ${o.status==="გაგზავნილი"?"selected":""}>გაგზავნილი</option><option ${o.status==="დასრულებული"?"selected":""}>დასრულებული</option><option ${o.status==="გაუქმებული"?"selected":""}>გაუქმებული</option></select></div>`).join(""):"<div class='card' style='padding:25px'>შეკვეთები ჯერ არ არის.</div>"}
async function status(id,status){let r=await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({status})});if(!r.ok)alert((await r.json()).error);else load()}
init();
</script></body></html>
